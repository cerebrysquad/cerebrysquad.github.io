<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Download</title>
</head>
<body>
  <script>
    window.addEventListener("load", () => {
      const link = document.createElement("a");
      link.href = "Sheet1.html";   // file to download
      link.download = "Sheet1.html"; // downloaded filename
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
